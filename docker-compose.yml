name: blog

services:
  # ================= PostgreSQL =================
  db:
    image: postgres:16-alpine
    container_name: blog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-blog_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    # Mở cổng cho DBeaver / Prisma Studio kết nối từ ngoài Docker.
    # Nếu sau này cài PostgreSQL local chiếm cổng 5432, đổi thành "5433:5432".
    ports:
      - "5432:5432"

  # ================= Backend API =================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-blog_db}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-with-at-least-32-characters}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-with-at-least-32-characters}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-1d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      # FE gọi API tại http://localhost:4000/api/v1 (theo README)
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    command: >
      sh -c "echo '[entrypoint] Syncing database schema...' &&
             npx prisma db push &&
             if [ \"$$SEED_ON_START\" = \"true\" ]; then npx tsx scripts/init-db.ts; fi &&
             echo '[entrypoint] Starting API server...' &&
             exec npx tsx src/server.ts"

volumes:
  pgdata:
